<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Dashboard</title></head>
<body>
  <h2>Links</h2>
  <table border="1" cellpadding="5">
    <tr><th>ID</th><th>Token</th><th>Created</th><th>Expires</th><th>Used</th><th>Photos</th><th>Actions</th></tr>
    {% for l in links %}
    <tr>
      <td>{{ l['id'] }}</td>
      <td>{{ l['token'] }}</td>
      <td>{{ l['created_at'] }}</td>
      <td>{{ l['expires_at'] }}</td>
      <td>{{ 'Yes' if l['used'] else 'No' }}</td>
      <td>{{ l['photo_count'] }}</td>
      <td><a href="/logs/{{ l['id'] }}">View logs</a></td>
    </tr>
    {% endfor %}
  </table>

  <h3>Create link</h3>
  <form id="createForm">
    <input name="note" placeholder="Optional note"/>
    <button type="submit">Create</button>
  </form>
  <div id="created"></div>

<script>
document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = new FormData(e.target);
  const r = await fetch('/create_link', { method: 'POST', body: form });
  const j = await r.json();
  if(r.ok){
    document.getElementById('created').innerHTML = 'Link: <a href="'+j.share_url+'" target="_blank">'+j.share_url+'</a>';
  } else {
    document.getElementById('created').textContent = 'Error: '+JSON.stringify(j);
  }
});
</script>
</body>
</html>
